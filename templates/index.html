<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 40px; }
        .calculator-box { background: #fff; max-width: 400px; margin: auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #004494; }
        .result-box { margin-top: 25px; padding: 15px; background: #e9f5e9; border-left: 5px solid #28a745; border-radius: 4px; }
        .result-box p { margin: 8px 0; font-size: 16px; color: #333; }
        .result-box span { font-weight: bold; color: #d9534f; font-size: 18px; }
    </style>
</head>
<body>

    <div class="calculator-box">
        <h2>EMI Calculator</h2>
        
        <!-- Yeh form app.py par data bhejega -->
        <form method="POST">
            <div class="form-group">
                <label>Loan Amount (₹)</label>
                <input type="number" name="principal" placeholder="e.g. 500000" required>
            </div>
            <div class="form-group">
                <label>Interest Rate (% p.a.)</label>
                <input type="number" step="0.01" name="rate" placeholder="e.g. 10.5" required>
            </div>
            <div class="form-group">
                <label>Tenure (in Months)</label>
                <input type="number" name="months" placeholder="e.g. 60" required>
            </div>
            <button type="submit">Calculate EMI</button>
        </form>

        <!-- Agar python se emi ka result aayega, tabhi yeh box dikhega -->
        {% if emi %}
        <div class="result-box">
            <p>Monthly EMI: <span>₹{{ emi }}</span></p>
            <p>Total Interest: <span>₹{{ total_interest }}</span></p>
            <p>Total Amount: <span>₹{{ total_amount }}</span></p>
        </div>
        {% endif %}
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .results {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
        .results h3 { margin-top: 0; color: #333; }
        .results p { margin: 8px 0; color: #495057; }
    </style>
</head>
<body>
    <div class="card">
        <h2>EMI Calculator</h2>
        <form method="POST">
            <div class="form-group">
                <label for="principal">Loan Amount (₹):</label>
                <input type="number" step="any" id="principal" name="principal" placeholder="e.g. 500000" required>
            </div>
            <div class="form-group">
                <label for="rate">Interest Rate (% per annum):</label>
                <input type="number" step="any" id="rate" name="rate" placeholder="e.g. 8.5" required>
            </div>
            <div class="form-group">
                <label for="months">Tenure (Months):</label>
                <input type="number" id="months" name="months" placeholder="e.g. 60" required>
            </div>
            <button type="submit">Calculate EMI</button>
        </form>

        {% if emi is not none %}
        <div class="results">
            <h3>Breakdown</h3>
            <p><strong>Monthly EMI:</strong> ₹{{ emi }}</p>
            <p><strong>Total Interest:</strong> ₹{{ total_interest }}</p>
            <p><strong>Total Payable:</strong> ₹{{ total_amount }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
